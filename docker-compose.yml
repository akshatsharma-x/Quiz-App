services:
  # Node.js API + Socket.io
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quizmuj-backend
    ports:
      - "127.0.0.1:5001:3000"   # direct API access from this machine only (use nginx on :8080 otherwise)
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Point at the internal MongoDB service (overrides MONGO_URI from .env)
      - MONGO_URI=mongodb://mongo:27017/quizmuj
      # Requests arrive through nginx on the private compose network
      - TRUST_PROXY=uniquelocal
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - quizmuj-network

  # Static frontend served by nginx, proxying /api and /socket.io to "web"
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quizmuj-frontend
    ports:
      - "8080:80"            # open http://localhost:8080
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - quizmuj-network

  mongo:
    image: mongo:7-jammy
    container_name: quizmuj-db
    ports:
      - "127.0.0.1:27017:27017"  # no auth on this dev database: never expose it beyond localhost
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - quizmuj-network

volumes:
  mongo-data:

networks:
  quizmuj-network:
    driver: bridge

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
    <meta name="theme-color" content="#0b1120">
    <title>Page not found | QuizMUJ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/app.css">
    <script src="/assets/js/app.js"></script>
</head>
<body>
    <main class="page-loader">
        <div class="empty reveal">
            <div class="empty-icon"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
            <h1 style="font-size:2rem;margin-bottom:.5rem">Page not found</h1>
            <p>The page you’re looking for doesn’t exist or has moved.</p>
            <div class="row" style="justify-content:center;margin-top:1.25rem">
                <a class="btn btn-primary" href="/index.html" id="homeLink">Go home</a>
                <a class="btn btn-secondary" href="/login.html">Sign in</a>
            </div>
        </div>
    </main>
    <script>
        if (QM.session.isValid() && QM.session.user) {
            const link = document.getElementById('homeLink');
            link.href = '/' + QM.homeFor(QM.session.user);
            link.textContent = 'Back to QuizMUJ';
        }
    </script>
</body>
</html>

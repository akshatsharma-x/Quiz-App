<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <meta name="theme-color" content="#0b1120">
    <title>Quick-start | QuizMUJ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/app.css">
    <script src="assets/js/app.js"></script>
    <style>
        .wiz { min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem; }
        .wiz-card { width: 100%; max-width: 680px; padding: 2.2rem; }
        .wiz-card h1 { margin: .6rem 0 .4rem; }
        .wiz-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
        .wiz-grid .span-2 { grid-column: 1 / -1; }
        .wiz-sep { grid-column: 1 / -1; border-top: 1px solid var(--border); margin: .4rem 0 0; padding-top: 1rem; }
        @media (max-width: 600px) { .wiz-grid { grid-template-columns: 1fr; } .wiz-card { padding: 1.4rem; } }
    </style>
</head>
<body>
    <main class="wiz">
        <section class="card wiz-card card-accent reveal">
            <div class="row-between">
                <a class="brand" href="admin.html"><span class="brand-mark">Q</span><span>Quiz<b>MUJ</b></span></a>
                <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle theme"><svg class="icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
            </div>
            <div class="mt-3">
                <span class="eyebrow">Quick-start wizard</span>
                <h1 id="hello">Set your teaching context</h1>
                <p class="muted">Choose the class you’re working with today. New quizzes, forms and announcements will be pre-filled with it for this session — you can always change it per quiz.</p>
            </div>
            <form id="wizForm" class="mt-3" novalidate>
                <div class="wiz-grid">
                    <div class="field"><label class="label" for="wProgram">Program</label><select class="select" id="wProgram"></select></div>
                    <div class="field"><label class="label" for="wBranch">Branch</label><select class="select" id="wBranch"></select></div>
                    <div class="field"><label class="label" for="wBatch">Batch</label><select class="select" id="wBatch"></select></div>
                    <div class="field"><label class="label" for="wSemester">Semester</label><select class="select" id="wSemester"></select></div>
                    <div class="field span-2"><label class="label" for="wSection">Section</label><select class="select" id="wSection"></select></div>
                    <div class="wiz-sep"></div>
                    <div class="field span-2"><label class="label" for="wSubject">Subject <span class="opt">optional</span></label><input class="input" id="wSubject" maxlength="60" placeholder="e.g. Database Management Systems"></div>
                    <div class="field"><label class="label" for="wStart">Default start <span class="opt">optional</span></label><input class="input" type="datetime-local" id="wStart"></div>
                    <div class="field"><label class="label" for="wDuration">Default duration <span class="opt">minutes</span></label><input class="input" type="number" id="wDuration" min="1" max="600" placeholder="e.g. 45"><span class="field-error"></span></div>
                </div>
                <div class="callout brand mt-3">
                    <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
                    <div>Audience: <strong id="audience">All students</strong></div>
                </div>
                <div class="row mt-3" style="justify-content:flex-end;flex-wrap:wrap">
                    <button type="button" class="btn btn-ghost" id="skipBtn">Skip for now</button>
                    <button type="submit" class="btn btn-primary btn-lg">Save &amp; open console</button>
                </div>
            </form>
        </section>
    </main>
    <script>
        (async () => {
            const { requireAuth, bindTargeting, targetLabel, fmt, $ } = QM;
            const user = await requireAuth({ role: 'admin' });
            $('#hello').textContent = `Welcome, ${user.name.split(' ')[0]} — set your context`;
            let saved = null;
            try { saved = JSON.parse(sessionStorage.getItem('quizmuj_admin_context') || localStorage.getItem('quizmuj_admin_context_last') || 'null'); } catch (e) { saved = null; }
            saved = saved || {};
            const targeting = await bindTargeting({
                program: $('#wProgram'), branch: $('#wBranch'), batchYear: $('#wBatch'), semester: $('#wSemester'), section: $('#wSection')
            }, saved);
            $('#wSubject').value = saved.subjectName || '';
            $('#wDuration').value = saved.defaultDuration || '';
            if (saved.defaultStart && new Date(saved.defaultStart) > new Date()) $('#wStart').value = fmt.toInputValue(saved.defaultStart);
            const refresh = () => { $('#audience').textContent = targetLabel(targeting.value()); };
            ['#wProgram', '#wBranch', '#wBatch', '#wSemester', '#wSection'].forEach((s) => $(s).addEventListener('change', refresh));
            refresh();

            $('#wizForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const duration = $('#wDuration').value ? Number($('#wDuration').value) : null;
                const field = $('#wDuration').closest('.field');
                if (duration !== null && (!(duration >= 1) || duration > 600)) {
                    field.classList.add('has-error');
                    field.querySelector('.field-error').textContent = 'Between 1 and 600 minutes';
                    return;
                }
                const start = $('#wStart').value ? new Date($('#wStart').value) : null;
                const context = {
                    ...targeting.value(),
                    subjectName: $('#wSubject').value.trim(),
                    defaultStart: start && !Number.isNaN(start.getTime()) ? start.toISOString() : null,
                    defaultDuration: duration
                };
                sessionStorage.setItem('quizmuj_admin_context', JSON.stringify(context));
                localStorage.setItem('quizmuj_admin_context_last', JSON.stringify({ ...context, defaultStart: null }));
                QM.flash(`Context set: ${targetLabel(context)}`, 'success');
                location.href = 'admin.html';
            });
            $('#skipBtn').addEventListener('click', () => {
                sessionStorage.setItem('quizmuj_admin_context_skipped', '1');
                location.href = 'admin.html';
            });
        })();
    </script>
</body>
</html>

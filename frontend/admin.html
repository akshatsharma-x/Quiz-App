<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <meta name="theme-color" content="#0b1120">
    <title>Faculty console | QuizMUJ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/app.css">
    <link rel="stylesheet" href="admin.css">
    <script src="assets/js/app.js"></script>
</head>
<body>
    <div class="console">
        <aside class="sidebar" id="sidebar" aria-label="Console navigation">
            <div class="sidebar-top">
                <a class="brand" href="#overview"><span class="brand-mark">Q</span><span>Quiz<b>MUJ</b></span></a>
                <span class="badge badge-brand">Faculty</span>
            </div>
            <nav class="side-nav" id="sideNav"></nav>
            <div class="sidebar-bottom">
                <div class="context-card" id="contextCard"></div>
                <div class="side-user">
                    <span class="avatar avatar-sm" id="sideAvatar">A</span>
                    <div class="grow"><strong id="sideName" class="truncate">Administrator</strong><span id="sideEmail" class="truncate"></span></div>
                    <button class="icon-btn" type="button" id="themeBtn" aria-label="Toggle theme" title="Toggle theme"></button>
                    <button class="icon-btn" type="button" id="logoutBtn" aria-label="Sign out" title="Sign out"></button>
                </div>
            </div>
        </aside>
        <div class="sidebar-scrim" id="scrim"></div>

        <div class="console-main">
            <header class="console-top">
                <button class="icon-btn menu-btn" type="button" id="menuBtn" aria-label="Open navigation"></button>
                <div class="grow">
                    <h1 id="viewTitle">Overview</h1>
                </div>
                <span class="conn" id="connStatus" title="Real-time connection"><span class="dot"></span><span>Connecting…</span></span>
                <a class="btn btn-primary btn-sm" href="create-quiz.html" id="topNewQuiz"></a>
            </header>
            <main class="console-view" id="view" tabindex="-1">
                <div class="page-loader"><div class="loader-ring"></div></div>
            </main>
        </div>
    </div>

    <script src="assets/js/charts.js"></script>
    <script src="admin.js"></script>
    <script src="admin-quizzes.js"></script>
    <script src="admin-manage.js"></script>
</body>
</html>

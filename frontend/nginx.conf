# QuizMUJ – static frontend + reverse proxy to the Node API (service "web" in docker-compose)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 3m;   # CSV uploads are capped at 2 MB by the API

    # Security headers (also sent on error pages)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # REST API (^~ stops the regex locations below from catching e.g. *.js under /api)
    location ^~ /api/ {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Socket.io (WebSocket upgrade + long-polling fallback); ^~ so socket.io.min.js is proxied
    location ^~ /socket.io/ {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # No build step means no hashed filenames: always revalidate code (ETag), cache media
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|avif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        default_type text/html;
        return 503 '<!doctype html><meta charset="utf-8"><title>QuizMUJ</title><body style="font-family:sans-serif;background:#0b1120;color:#eef2fa;display:grid;place-items:center;height:100vh;margin:0"><div style="text-align:center"><h1>QuizMUJ is starting up</h1><p>The server is temporarily unavailable. Please try again in a moment.</p></div>';
    }
}

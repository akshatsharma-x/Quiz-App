<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <meta name="theme-color" content="#0b1120">
    <title>My profile | QuizMUJ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/app.css">
    <link rel="stylesheet" href="profile-setup.css">
    <script src="assets/js/app.js"></script>
</head>
<body>
    <header id="appNav"></header>

    <main class="container page" id="main">
        <div class="page-loader"><div class="loader-ring"></div></div>
    </main>

    <template id="setupTpl">
        <div class="setup-wrap">
            <div class="card setup-card card-accent reveal">
                <div class="setup-head">
                    <a class="brand" href="index.html"><span class="brand-mark">Q</span><span>Quiz<b>MUJ</b></span></a>
                    <span class="eyebrow">Step 2 of 2 · Academic identity</span>
                    <h1 data-greet>Welcome!</h1>
                    <p class="muted">Tell us where you study. Quizzes are published to specific programs, batches and sections — this makes sure you see the right ones.</p>
                </div>
                <form data-profile-form class="stack" novalidate></form>
                <p class="center small subtle mt-2">Signed in as <strong data-email></strong> · <button type="button" class="link-btn" data-logout>Not you? Sign out</button></p>
            </div>
        </div>
    </template>

    <template id="profileFormTpl">
        <div class="field span-2" data-name-field>
            <label class="label" for="pfName">Full name</label>
            <input class="input" id="pfName" maxlength="80" autocomplete="name" required>
            <span class="field-error"></span>
        </div>
        <div class="form-grid">
            <div class="field">
                <label class="label" for="pfProgram">Program</label>
                <select class="select" id="pfProgram" required></select>
                <span class="field-error"></span>
            </div>
            <div class="field">
                <label class="label" for="pfBranch">Branch</label>
                <select class="select" id="pfBranch" required disabled></select>
                <span class="field-error"></span>
            </div>
            <div class="field">
                <label class="label" for="pfBatch">Batch</label>
                <select class="select" id="pfBatch" required disabled></select>
                <span class="field-error"></span>
            </div>
            <div class="field">
                <label class="label" for="pfSemester">Current semester</label>
                <select class="select" id="pfSemester" required disabled></select>
                <span class="field-error"></span>
            </div>
            <div class="field span-2">
                <label class="label" for="pfSection">Section</label>
                <div class="section-picker" id="pfSection" role="radiogroup" aria-label="Section"></div>
                <span class="field-error"></span>
            </div>
        </div>
        <div class="cohort-preview" aria-live="polite">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
            <div><span class="small subtle">You’ll receive quizzes for</span><strong data-preview>Complete the fields above</strong></div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block" data-save>Save &amp; continue</button>
    </template>

    <script src="assets/js/shell.js"></script>
    <script src="profile-setup.js"></script>
</body>
</html>

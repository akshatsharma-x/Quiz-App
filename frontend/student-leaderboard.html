<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <meta name="theme-color" content="#0b1120">
    <title>Leaderboard | QuizMUJ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/app.css">
    <link rel="stylesheet" href="student-leaderboard.css">
    <script src="assets/js/app.js"></script>
</head>
<body>
    <header id="appNav"></header>
    <main class="container page">
        <div class="page-head reveal">
            <div>
                <span class="eyebrow"><span class="badge badge-critical badge-live" style="height:20px">Live</span> Hall of fame</span>
                <h1>Leaderboard</h1>
                <p>Every point you score earns 10 XP. Climb the ranks in your section, your batch, or the whole university.</p>
            </div>
            <div class="segmented" role="group" aria-label="Leaderboard scope" id="scope">
                <button type="button" data-scope="global" aria-pressed="true">University</button>
                <button type="button" data-scope="batch" aria-pressed="false">My batch</button>
                <button type="button" data-scope="section" aria-pressed="false">My section</button>
            </div>
        </div>

        <section class="card me-card reveal" id="meCard" style="--d:.05s"><div class="skeleton sk-block"></div></section>

        <div class="lb-grid mt-3">
            <section class="card reveal" style="--d:.1s">
                <div class="podium" id="podium"></div>
                <ol class="lb-list" id="lbList"></ol>
            </section>
            <aside class="card card-pad reveal tiers" style="--d:.15s">
                <h3>Tiers</h3>
                <p class="small muted mb-2">Your tier is based on the XP you’ve earned.</p>
                <ul class="tier-list" id="tierList"></ul>
            </aside>
        </div>
    </main>
    <script src="assets/js/shell.js"></script>
    <script src="student-leaderboard.js"></script>
</body>
</html>
